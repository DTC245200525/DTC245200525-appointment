
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "appointment"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
